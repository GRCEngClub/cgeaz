name: drift-detection

# Detector 1 of 2: does reality still match the code? (Detector 2 is the KQL tripwire —
# who's been touching reality? — scheduled in Log Analytics.)
# terraform plan -detailed-exitcode: 0 = clean, 2 = drift. Drift opens an issue with the diff.

on:
  schedule:
    - cron: "0 8 * * *"   # daily; the collector sweeps hourly, so any hour is after a sweep
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}

jobs:
  drift:
    # Runs only in forks that have been armed (Lab 6: labs/06-loop/arm-your-fork.sh).
    # The upstream GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo,
    # a pull_request OIDC subject matches PRs from any fork — arming upstream would
    # hand fork PRs a path toward the course subscription. Your fork, your identity,
    # your sandbox subscription only.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [01-foundation, 03-evidence-store, 04-reporting, 06-enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # backend.hcl is gitignored (bootstrap.sh writes it per learner), so a CI checkout
      # never has it; rebuild it from the repository variable before init.
      - name: write backend config
        run: |
          cat > labs/03-foundation/backend.hcl <<EOF
          resource_group_name  = "rg-grc-tfstate"
          storage_account_name = "${TF_VAR_state_storage_account}"
          container_name       = "tfstate"
          EOF

      - name: plan with detailed exit code
        id: plan
        working-directory: stages/${{ matrix.stage }}
        run: |
          terraform init -input=false -backend-config=../../labs/03-foundation/backend.hcl
          # Exit code 2 is the whole point (drift) and must reach $GITHUB_OUTPUT intact. Piping the
          # plan through tee would let tee's 0 win, so write the plan to a file, capture $? straight
          # from terraform, and only then print the file.
          set +e
          terraform plan -input=false -detailed-exitcode -no-color -out=drift.plan > plan-output.txt 2>&1
          ec=$?
          set -e
          cat plan-output.txt
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"

      # One open issue per stage: a night of continued drift adds a comment, not a duplicate.
      - name: open or update the drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          STAGE: ${{ matrix.stage }}
        with:
          script: |
            const fs = require('fs');
            const stage = process.env.STAGE;
            const marker = `<!-- drift:${stage} -->`;
            const plan = fs.readFileSync(`stages/${stage}/plan-output.txt`, 'utf8').slice(0, 55000);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nReality no longer matches the code in \`stages/${stage}\` ([run](${run})).\n\n\`\`\`\n${plan}\n\`\`\``;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'drift', per_page: 100,
            });
            const existing = open.find(i => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `Still drifted as of ${new Date().toISOString()} ([run](${run})).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Drift detected: stages/${stage} (${new Date().toISOString().slice(0, 10)})`,
                body, labels: ['drift'],
              });
            }

      # A clean plan closes the issue: the finding resolves itself when the drift does.
      - name: close the drift issue when the stage is clean again
        if: steps.plan.outputs.exitcode == '0'
        uses: actions/github-script@v7
        env:
          STAGE: ${{ matrix.stage }}
        with:
          script: |
            const marker = `<!-- drift:${process.env.STAGE} -->`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'drift', per_page: 100,
            });
            for (const issue of open.filter(i => (i.body || '').includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: 'The plan is clean again; closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed',
              });
            }

      # 0 = clean, 2 = drift (issue above). Anything else means the plan itself broke: a red job, not a silent green.
      - name: fail if the plan did not complete
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: |
          echo "terraform plan did not complete (exit ${{ steps.plan.outputs.exitcode }}); see the plan step"
          exit 1

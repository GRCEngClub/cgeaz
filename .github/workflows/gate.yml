name: compliance-gate

# The pipeline enforces policy on your environment. This gate enforces policy on the
# pipeline. No governance change merges without passing the same kind of scrutiny the
# pipeline applies to everything else.

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC federation — no client secret stored in GitHub, nothing to rotate
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}

jobs:
  gate:
    # Runs only in forks that have been armed (Lab 6: labs/06-loop/arm-your-fork.sh).
    # The upstream GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo,
    # a pull_request OIDC subject matches PRs from any fork — arming upstream would
    # hand fork PRs a path toward the course subscription. Your fork, your identity,
    # your sandbox subscription only.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      # Each stage gets its own verdict; one failing stage must not cancel the others.
      fail-fast: false
      matrix:
        stage: [01-foundation, 03-evidence-store, 04-reporting, 06-enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # backend.hcl is gitignored (bootstrap.sh writes it per learner), so a CI checkout
      # never has it; rebuild it from the repository variable before init.
      - name: write backend config
        run: |
          cat > labs/03-foundation/backend.hcl <<EOF
          resource_group_name  = "rg-grc-tfstate"
          storage_account_name = "${TF_VAR_state_storage_account}"
          container_name       = "tfstate"
          EOF

      - name: terraform validate + plan
        working-directory: stages/${{ matrix.stage }}
        run: |
          terraform init -input=false -backend-config=../../labs/03-foundation/backend.hcl
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=tf.plan
          terraform show -json tf.plan > plan.json

      # instrumenta/conftest-action@master bundles a 2021 OPA that cannot parse
      # `import rego.v1`, which every policy here uses, and it was unpinned. Run a
      # pinned release instead and verify its checksum before executing it.
      - name: install conftest (pinned, checksum-verified)
        run: |
          V=0.50.0
          curl -sSfL -o conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz"
          echo "a0e1421d0df83ad2ea7bca3235541de432c31901cb3a616895623bd8e480479d  conftest.tgz" | sha256sum -c -
          tar -xzf conftest.tgz conftest

      - name: OPA gate (conftest)
        run: ./conftest test stages/${{ matrix.stage }}/plan.json -p policy
